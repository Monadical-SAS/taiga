version: "3.5"

# Environment variables that will be used by backend services
x-environment: &default-back-environment
  # Database settings
  POSTGRES_DB: "taiga"
  POSTGRES_USER: "${POSTGRES_USER:-taiga}"
  POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-taiga}"
  POSTGRES_HOST: "taiga-db"
  # Taiga settings
  TAIGA_SECRET_KEY: "${SECRET_KEY:-taiga-secret-key}"
  TAIGA_SITES_SCHEME: "${TAIGA_SCHEME:-http}"
  TAIGA_SITES_DOMAIN: "${TAIGA_DOMAIN:-localhost:9000}"
  TAIGA_SUBPATH: "${SUBPATH:-}"
  # Email settings
  EMAIL_BACKEND: "django.core.mail.backends.${EMAIL_BACKEND:-console}.EmailBackend"
  DEFAULT_FROM_EMAIL: "${EMAIL_DEFAULT_FROM:-no-reply@example.com}"
  EMAIL_USE_TLS: "${EMAIL_USE_TLS:-False}"
  EMAIL_USE_SSL: "${EMAIL_USE_SSL:-False}"
  EMAIL_HOST: "${EMAIL_HOST:-}"
  EMAIL_PORT: "${EMAIL_PORT:-25}"
  EMAIL_HOST_USER: "${EMAIL_HOST_USER:-}"
  EMAIL_HOST_PASSWORD: "${EMAIL_HOST_PASSWORD:-}"
  # Rabbitmq settings
  RABBITMQ_USER: "${RABBITMQ_USER:-taiga}"
  RABBITMQ_PASS: "${RABBITMQ_PASS:-taiga}"
  RABBITMQ_VHOST: "${RABBITMQ_VHOST:-taiga}"
  # Telemetry settings
  ENABLE_TELEMETRY: "${ENABLE_TELEMETRY:-True}"

# Volumes that will be used by backend services
x-volumes: &default-back-volumes
  - taiga-static-data:/taiga-back/static
  - taiga-media-data:/taiga-back/media
  # Uncomment to use custom configuration
  # - ./config.py:/taiga-back/settings/config.py

services:
  taiga-db:
    image: postgres:12.3
    build:
      context: .
      dockerfile: Dockerfile.postgres
    environment:
      POSTGRES_DB: "taiga"
      POSTGRES_USER: "${POSTGRES_USER:-taiga}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-taiga}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-taiga}"]
      interval: 2s
      timeout: 15s
      retries: 5
      start_period: 3s
    volumes:
      - taiga-db-data:/var/lib/postgresql/data
    networks:
      - taiga

  taiga-back:
    image: taigaio/taiga-back:latest
    build:
      context: .
      dockerfile: Dockerfile.back
    environment: *default-back-environment
    volumes: *default-back-volumes
    networks:
      - taiga
    depends_on:
      taiga-db:
        condition: service_healthy
      taiga-events-rabbitmq:
        condition: service_started
      taiga-async-rabbitmq:
        condition: service_started

  taiga-async:
    image: taigaio/taiga-back:latest
    build:
      context: .
      dockerfile: Dockerfile.back
    entrypoint: ["/taiga-back/docker/async_entrypoint.sh"]
    environment: *default-back-environment
    volumes: *default-back-volumes
    networks:
      - taiga
    depends_on:
      taiga-db:
        condition: service_healthy
      taiga-events-rabbitmq:
        condition: service_started
      taiga-async-rabbitmq:
        condition: service_started

  taiga-async-rabbitmq:
    image: rabbitmq:3.8-management-alpine
    build:
      context: .
      dockerfile: Dockerfile.rabbitmq
    environment:
      RABBITMQ_ERLANG_COOKIE: "${RABBITMQ_ERLANG_COOKIE:-secret-erlang-cookie}"
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_USER:-taiga}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_PASS:-taiga}"
      RABBITMQ_DEFAULT_VHOST: "${RABBITMQ_VHOST:-taiga}"
    hostname: "taiga-async-rabbitmq"
    volumes:
      - taiga-async-rabbitmq-data:/var/lib/rabbitmq
    networks:
      - taiga

  taiga-front:
    image: taigaio/taiga-front:latest
    build:
      context: .
      dockerfile: Dockerfile.front
    environment:
      TAIGA_URL: "${TAIGA_SCHEME:-http}://${TAIGA_DOMAIN:-localhost:9000}"
      TAIGA_WEBSOCKETS_URL: "${WEBSOCKETS_SCHEME:-ws}://${TAIGA_DOMAIN:-localhost:9000}"
      TAIGA_SUBPATH: "${SUBPATH:-}"
    networks:
      - taiga
    # Uncomment to use custom configuration
    # volumes:
    #   - ./conf.json:/usr/share/nginx/html/conf.json

  taiga-events:
    image: taigaio/taiga-events:latest
    build:
      context: .
      dockerfile: Dockerfile.events
    environment:
      RABBITMQ_USER: "${RABBITMQ_USER:-taiga}"
      RABBITMQ_PASS: "${RABBITMQ_PASS:-taiga}"
      TAIGA_SECRET_KEY: "${SECRET_KEY:-taiga-secret-key}"
    networks:
      - taiga
    depends_on:
      taiga-events-rabbitmq:
        condition: service_started

  taiga-events-rabbitmq:
    image: rabbitmq:3.8-management-alpine
    build:
      context: .
      dockerfile: Dockerfile.rabbitmq
    environment:
      RABBITMQ_ERLANG_COOKIE: "${RABBITMQ_ERLANG_COOKIE:-secret-erlang-cookie}"
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_USER:-taiga}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_PASS:-taiga}"
      RABBITMQ_DEFAULT_VHOST: "${RABBITMQ_VHOST:-taiga}"
    hostname: "taiga-events-rabbitmq"
    volumes:
      - taiga-events-rabbitmq-data:/var/lib/rabbitmq
    networks:
      - taiga

  taiga-protected:
    image: taigaio/taiga-protected:latest
    build:
      context: .
      dockerfile: Dockerfile.protected
    environment:
      MAX_AGE: "${ATTACHMENTS_MAX_AGE:-360}"
      SECRET_KEY: "${SECRET_KEY:-taiga-secret-key}"
    networks:
      - taiga

  taiga-gateway:
    image: nginx:1.19-alpine
    build:
      context: .
      dockerfile: Dockerfile.gateway
    ports:
      - "9000:80"
    volumes:
      - taiga-static-data:/taiga/static
      - taiga-media-data:/taiga/media
    networks:
      - taiga
    depends_on:
      - taiga-front
      - taiga-back
      - taiga-events
    configs:
      - source: nginx_config
        target: /etc/nginx/conf.d/default.conf

volumes:
  taiga-static-data:
  taiga-media-data:
  taiga-db-data:
  taiga-async-rabbitmq-data:
  taiga-events-rabbitmq-data:

configs:
  nginx_config:
    content: |
      server {
          listen 80 default_server;
          server_name taiga.app.monadical.io;

          client_max_body_size 100M;
          charset utf-8;

          # Frontend
          location / {
              proxy_set_header Host $$http_host;
              proxy_set_header X-Real-IP $$remote_addr;
              proxy_set_header X-Scheme $$scheme;
              proxy_set_header X-Forwarded-Proto $$scheme;
              proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
              proxy_redirect off;
              proxy_pass http://taiga-front/;
          }

          # API
          location /api/ {
              proxy_pass http://taiga-back:8000/api/;
              proxy_pass_header Server;
              proxy_set_header Host $$http_host;
              proxy_redirect off;
              proxy_set_header X-Real-IP $$remote_addr;
              proxy_set_header X-Scheme $$scheme;
          }

          # Admin
          location /admin/ {
              proxy_pass http://taiga-back:8000/admin/;
              proxy_pass_header Server;
              proxy_set_header Host $$http_host;
              proxy_redirect off;
              proxy_set_header X-Real-IP $$remote_addr;
              proxy_set_header X-Scheme $$scheme;
          }

          # Static
          location /static/ {
              alias /taiga/static/;
          }

          # Media
          location /_protected/ {
              internal;
              alias /taiga/media/;
              add_header Content-disposition "attachment";
          }

          # Unprotected section
          location /media/exports/ {
              alias /taiga/media/exports/;
              add_header Content-disposition "attachment";
          }

          location /media/ {
              proxy_set_header Host $$http_host;
              proxy_set_header X-Real-IP $$remote_addr;
              proxy_set_header X-Scheme $$scheme;
              proxy_set_header X-Forwarded-Proto $$scheme;
              proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
              proxy_pass http://taiga-protected:8003/;
              proxy_redirect off;
          }

          # Events
          location /events {
              proxy_pass http://taiga-events:8888/events;
              proxy_http_version 1.1;
              proxy_set_header Upgrade $$http_upgrade;
              proxy_set_header Connection "upgrade";
              proxy_set_header Host $$host;
              proxy_connect_timeout 7d;
              proxy_send_timeout 7d;
              proxy_read_timeout 7d;
          }
      }

networks:
  taiga:
    driver: bridge